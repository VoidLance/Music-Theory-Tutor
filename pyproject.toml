[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "musor"
version = "0.1.0"
description = "A terminal-based music theory companion for key signatures, relative keys, and broader study."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Your Name" }]

[project.scripts]
musor = "musor.cli:main_entry"

[tool.setuptools]
packages = ["musor"]
